  <circle cx="650" cy="275" r="15" fill="#90CAF9" stroke="#333" stroke-width="1"/>
  <text x="650" y="280" font-size="9" text-anchor="middle" font-weight="bold">PC-TARTU</text>
  <text x="680" y="305" font-size="9" text-anchor="middle" fill="#2E7D32">Liiklus on TURVALINE</text>
  
  <rect x="510" y="350" width="340" height="110" fill="#C8E6C9" stroke="#333" stroke-width="1"/>
  <text x="680" y="368" font-size="10" text-anchor="middle" fill="#333">show crypto ipsec sa</text>
  <text x="680" y="388" font-size="9" text-anchor="middle" fill="#2E7D32" font-weight="bold">pkts encaps: 5</text>
