  <text x="680" y="165" font-size="9" text-anchor="middle" fill="#666">Liiklus on NÄHTAV</text>
  
  <rect x="510" y="210" width="340" height="120" fill="#C8E6C9" stroke="#333" stroke-width="1"/>
  <text x="680" y="230" font-size="11" font-weight="bold" text-anchor="middle">Pärast tunneli (Phase 2)</text>
