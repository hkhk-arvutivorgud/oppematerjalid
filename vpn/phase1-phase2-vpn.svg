  <text x="60" y="205" font-size="9" text-anchor="middle" fill="#333">peavad samad:</text>
  <text x="60" y="220" font-size="9" text-anchor="middle" fill="#E53935" font-weight="bold">aes, sha, group 2</text>
  
  <text x="380" y="190" font-size="9" text-anchor="middle" fill="#333">HAGGLE</text>
  <text x="380" y="205" font-size="9" text-anchor="middle" fill="#333">peavad samad:</text>
  <text x="380" y="220" font-size="9" text-anchor="middle" fill="#E53935" font-weight="bold">aes, sha, group 2</text>
  
