<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="400" fill="#f9f9f9"/>
  
  <!-- Tallinn LAN -->
  <rect x="20" y="20" width="200" height="120" fill="#e8f4f8" stroke="#333" stroke-width="2"/>
  <text x="120" y="45" font-size="14" font-weight="bold" text-anchor="middle">Tallinn LAN</text>
  <circle cx="60" cy="100" r="20" fill="#90CAF9" stroke="#333" stroke-width="2"/>
  <text x="60" y="105" font-size="10" text-anchor="middle">PC-TLN</text>
  <text x="60" y="120" font-size="9" text-anchor="middle" fill="#666">10.M.1.10</text>
  
  <circle cx="180" cy="100" r="20" fill="#FFB74D" stroke="#333" stroke-width="2"/>
  <text x="180" y="100" font-size="10" text-anchor="middle">SW-TLN</text>
  <text x="180" y="120" font-size="9" text-anchor="middle" fill="#666">Switch</text>
  
  <!-- Tallinn Router -->
  <rect x="80" y="200" width="100" height="80" fill="#FFF9C4" stroke="#333" stroke-width="2"/>
  <text x="130" y="225" font-size="11" font-weight="bold" text-anchor="middle">R-TLN</text>
  <text x="130" y="242" font-size="9" text-anchor="middle" fill="#333">g0/1: 10.M.1.1</text>
  <text x="130" y="257" font-size="9" text-anchor="middle" fill="#333">g0/0: 203.0.113.1</text>
  <text x="130" y="272" font-size="9" text-anchor="middle" fill="#E53935">IPSec config</text>
  
  <!-- ISP Router (center) -->
  <rect x="480" y="200" width="100" height="80" fill="#F8BBD0" stroke="#333" stroke-width="2"/>
  <text x="530" y="225" font-size="11" font-weight="bold" text-anchor="middle">R-ISP</text>
  <text x="530" y="242" font-size="9" text-anchor="middle" fill="#333">g0/0: 203.0.113.2</text>
  <text x="530" y="257" font-size="9" text-anchor="middle" fill="#333">g0/1: 198.51.100.1</text>
  <text x="530" y="272" font-size="9" text-anchor="middle" fill="#999">(no routes to 10.x)</text>
  
  <!-- Tartu Router -->
  <rect x="880" y="200" width="100" height="80" fill="#FFF9C4" stroke="#333" stroke-width="2"/>
  <text x="930" y="225" font-size="11" font-weight="bold" text-anchor="middle">R-TARTU</text>
  <text x="930" y="242" font-size="9" text-anchor="middle" fill="#333">g0/0: 198.51.100.2</text>
  <text x="930" y="257" font-size="9" text-anchor="middle" fill="#333">g0/1: 10.M.2.1</text>
  <text x="930" y="272" font-size="9" text-anchor="middle" fill="#E53935">IPSec config</text>
  
  <!-- Tartu LAN -->
  <rect x="980" y="20" width="200" height="120" fill="#e8f4f8" stroke="#333" stroke-width="2"/>
  <text x="1080" y="45" font-size="14" font-weight="bold" text-anchor="middle">Tartu LAN</text>
  <circle cx="1020" cy="100" r="20" fill="#FFB74D" stroke="#333" stroke-width="2"/>
  <text x="1020" y="100" font-size="10" text-anchor="middle">SW-TARTU</text>
  <text x="1020" y="120" font-size="9" text-anchor="middle" fill="#666">Switch</text>
  
  <circle cx="1140" cy="100" r="20" fill="#90CAF9" stroke="#333" stroke-width="2"/>
  <text x="1140" y="105" font-size="10" text-anchor="middle">PC-TARTU</text>
  <text x="1140" y="120" font-size="9" text-anchor="middle" fill="#666">10.M.2.10</text>
  
  <!-- Connections -->
  <line x1="130" y1="140" x2="130" y2="200" stroke="#333" stroke-width="2"/>
  <text x="140" y="170" font-size="9" fill="#333">g0/1</text>
  
  <line x1="60" y1="120" x2="100" y2="120" stroke="#333" stroke-width="2"/>
  <line x1="100" y1="120" x2="160" y2="120" stroke="#333" stroke-width="2"/>
  <line x1="160" y1="120" x2="160" y2="200" stroke="#333" stroke-width="2"/>
  
  <line x1="180" y1="240" x2="480" y2="240" stroke="#333" stroke-width="2"/>
  <text x="330" y="235" font-size="9" fill="#333">203.0.113.0/30</text>
  
  <text x="330" y="295" font-size="9" fill="#E53935" font-weight="bold">IPSec Tunnel</text>
  <path d="M 180 280 Q 355 320 480 280" stroke="#E53935" stroke-width="3" fill="none" stroke-dasharray="5,5"/>
  
  <line x1="580" y1="240" x2="880" y2="240" stroke="#333" stroke-width="2"/>
  <text x="730" y="235" font-size="9" fill="#333">198.51.100.0/30</text>
  
  <line x1="930" y1="200" x2="930" y2="140" stroke="#333" stroke-width="2"/>
  <text x="910" y="170" font-size="9" fill="#333">g0/1</text>
  
  <line x1="930" y1="140" x2="1020" y2="140" stroke="#333" stroke-width="2"/>
  <line x1="1020" y1="140" x2="1140" y2="140" stroke="#333" stroke-width="2"/>
  <line x1="1020" y1="120" x2="1020" y2="140" stroke="#333" stroke-width="2"/>
  
  <!-- Title -->
  <text x="600" y="350" font-size="13" font-weight="bold" text-anchor="middle">Site-to-site IPSec topologia</text>
</svg>